version: "3.8"

services:
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://SEU_IP_VPS:8080
      - AUTHENTICATION_API_KEY=TROQUE_POR_UMA_CHAVE_SECRETA
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DEL_INSTANCE=false
      - QRCODE_LIMIT=30
      - LOG_LEVEL=ERROR
      - LOG_COLOR=true
      - DATABASE_ENABLED=false
      - REDIS_ENABLED=false
      - WEBHOOK_GLOBAL_ENABLED=false
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=SEU_IP_VPS
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://SEU_IP_VPS:5678
      - NODE_FUNCTION_ALLOW_BUILTIN=child_process,fs,path,https,http
      - N8N_RUNNERS_HEARTBEAT_INTERVAL=300
      - N8N_RUNNERS_TASK_TIMEOUT=900
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  evolution_instances:
  evolution_store:
  n8n_data:
